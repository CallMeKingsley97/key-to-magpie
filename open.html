<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打开 magpie</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f9;
      --card: #ffffff;
      --fg: #17171c;
      --muted: #66666f;
      --line: #e6e6eb;
      --brand: #7c3aed;
      --brand2: #ec4899;
      --ok: #16a34a;
      --warn: #b45309;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e12;
        --card: #17171d;
        --fg: #f4f4f7;
        --muted: #a1a1ac;
        --line: #2a2a33;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(1200px 700px at 50% -10%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 70%), var(--bg);
      color: var(--fg);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(460px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .18);
      padding: 26px;
    }
    .mark {
      width: 46px; height: 46px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      margin-bottom: 18px;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--brand) 35%, transparent);
    }
    .mark svg { width: 24px; height: 24px; }
    h1 { font-size: 19px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -.01em; }
    p { margin: 0 0 12px; color: var(--muted); }
    .name {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
      color: var(--fg);
      font-weight: 700;
    }
    .facts {
      margin: 16px 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      font-size: 13px;
    }
    .facts div { display: flex; gap: 10px; align-items: baseline; }
    .facts dt { flex: 0 0 68px; color: var(--muted); }
    .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .actions { display: grid; gap: 10px; }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg);
      border-radius: 11px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .btn:hover { background: color-mix(in srgb, var(--fg) 5%, var(--card)); }
    .btn:active { transform: scale(.985); }
    .btn.primary {
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 10px 24px color-mix(in srgb, var(--brand) 30%, transparent);
    }
    .btn.primary:hover { filter: brightness(1.05); }
    .status {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 14px 0 0;
      padding: 11px 13px;
      border-radius: 11px;
      background: color-mix(in srgb, var(--warn) 12%, transparent);
      color: var(--warn);
      font-size: 13px;
    }
    .status.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
    .status .dot { flex: 0 0 auto; margin-top: 6px; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .hidden { display: none !important; }
    .foot { margin-top: 16px; font-size: 12px; color: var(--muted); }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
      border-top-color: currentColor;
      display: inline-block; vertical-align: -2px; margin-right: 8px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
    </div>

    <h1 id="title">正在打开 magpie…</h1>
    <p id="sub">magpie 会先显示要添加的 provider、host 和模型，确认后才会保存。</p>

    <div class="facts" id="facts"></div>

    <div class="actions">
      <a class="btn primary" id="open" href="#">在 magpie 中打开</a>
      <button class="btn" id="copy" type="button">复制导入链接</button>
      <button class="btn" id="done" type="button">我已添加，关闭此页</button>
    </div>

    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText"><span class="spinner"></span>正在尝试唤起 magpie…</span>
    </div>

    <p class="foot" id="foot">如果浏览器提示“是否打开 magpie”，请选择“打开”。链接中的 key 只保存在本机和 magpie 配置中。</p>
  </main>
  <script src="open.js"></script>
</body>
</html>
